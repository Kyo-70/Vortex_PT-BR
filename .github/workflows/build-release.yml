name: Validate and build translation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de uma release existente para anexar o launcher (ex.: v1.6.14)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate translations
        run: python scripts/validate-locales.py

      - name: Build download files
        run: python scripts/build_package.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-PT-BR
          path: dist/*
          if-no-files-found: error

      - name: Create release for manual launcher publishing when needed
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.js --title "Vortex PT-BR $RELEASE_TAG" --generate-notes
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.js --title "Vortex PT-BR $GITHUB_REF_NAME" --generate-notes

  build-launcher:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build graphical launcher
        shell: pwsh
        run: |
          $version = (Get-Content "resources/locales/pt-BR/info.json" -Raw | ConvertFrom-Json).version
          dotnet publish "installer/VortexPtBrLauncher.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$version `
            --output "dist/launcher"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist/launcher/Vortex_PT-BR_Launcher.exe" "dist/Vortex_PT-BR_Launcher.exe" -Force

      - name: Attach launcher to release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:GITHUB_REF_NAME }
          gh release upload $tag "dist/Vortex_PT-BR_Launcher.exe" --clobber

      - name: Upload launcher build for main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-PT-BR-Launcher
          path: dist/Vortex_PT-BR_Launcher.exe
          if-no-files-found: error
