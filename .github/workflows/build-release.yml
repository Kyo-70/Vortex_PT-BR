name: Validate and build translation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate translations
        run: python scripts/validate-locales.py

      - name: Build download files
        run: python scripts/build_package.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-PT-BR
          path: dist/*
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.js --title "Vortex PT-BR $GITHUB_REF_NAME" --generate-notes
